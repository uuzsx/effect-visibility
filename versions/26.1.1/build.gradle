plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id
base { archivesName = "effect-visibility-mc${minecraft_version}-neoforge" }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
repositories { mavenCentral() }

neoForge {
    version = project.neo_version
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
    }
    mods {
        "${mod_id}" { sourceSet sourceSets.main }
    }
}

// Opt-in development harness; never packaged in the release JAR.
if (providers.gradleProperty('smokeTest').isPresent()) {
    sourceSets { smoke }
    dependencies { smokeImplementation sourceSets.main.output }
    neoForge {
        addModdingDependenciesTo sourceSets.smoke
        mods {
            effect_visibility_smoke { sourceSet sourceSets.smoke }
        }
        runs {
            smokeClient {
                client()
                sourceSet = sourceSets.smoke
                gameDirectory = project.file('run-smoke')
                programArguments.addAll '--width', '640', '--height', '480'
                systemProperty 'mixin.debug.export', 'true'
            }
        }
    }
}

configurations { runtimeClasspath.extendsFrom localRuntime }
dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('test', Test) { useJUnitPlatform() }

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var values = [
        minecraft_version_range: minecraft_version_range,
        neo_version: neo_version,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version
    ]
    inputs.properties values
    expand values
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('jar', Jar) {
    includeEmptyDirs = false
    from('LICENSE', 'TEMPLATE_LICENSE.txt')
}
